services:
  postgres:
    image: postgres:16-alpine
    container_name: ruby-app-postgres
    environment:
      POSTGRES_DB: ruby_app_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruby_app_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
